<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fond arrondi -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Bordure néon subtile -->
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-opacity="0.4" />

  <!-- Bulle de dialogue principale -->
  <path d="M 120 140 C 120 110, 140 90, 170 90 L 342 90 C 372 90, 392 110, 392 140 L 392 280 C 392 310, 372 330, 342 330 L 220 330 L 150 390 L 160 330 L 170 330 C 140 330, 120 310, 120 280 Z" 
        fill="#1e293b" 
        stroke="url(#accentGrad)" 
        stroke-width="10" 
        filter="url(#glow)" />

  <!-- Ondes sonores dans la bulle (symbole de voix & transcription) -->
  <rect x="180" y="190" width="16" height="40" rx="8" fill="#38bdf8" />
  <rect x="215" y="160" width="16" height="100" rx="8" fill="#60a5fa" />
  <rect x="250" y="140" width="16" height="140" rx="8" fill="#818cf8" />
  <rect x="285" y="170" width="16" height="80" rx="8" fill="#a855f7" />
  <rect x="320" y="195" width="16" height="30" rx="8" fill="#c084fc" />

  <!-- Badge Accessibilité / CC sous la bulle -->
  <g transform="translate(186, 410)">
    <rect x="0" y="0" width="140" height="44" rx="12" fill="#334155" />
    <text x="70" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="2">LIVE CC</text>
  </g>
</svg>
